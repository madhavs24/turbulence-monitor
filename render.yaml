# One-click deploy to Render (free tier). Push this repo to GitHub, then
# Render dashboard -> New -> Blueprint -> pick the repo. See DEPLOY_RENDER.md.
services:
  - type: web
    name: madhav-turbulence-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SSE_ONLY
        value: "1"               # static-first: Render serves Live Pulse SSE only
      - key: TURB_MODE
        value: auto              # dashboard loads from CDN snapshot.json; engine skipped when SSE_ONLY
      - key: LIVE_NEWS_MODE
        value: live              # real RSS news producer for the Live Pulse
