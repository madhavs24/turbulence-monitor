# Daily precompute: build web/static/snapshot.json on GitHub's runners (FRED/Yahoo are
# reachable + fast here) and commit it. The website then loads this instantly — no
# request-path computation, no "engine warming".
name: refresh-snapshot

on:
  schedule:
    - cron: "0 11 * * 1-5"     # ~11:00 UTC on weekdays (after data updates). All times UTC.
  workflow_dispatch: {}         # allow manual "Run workflow"

permissions:
  contents: write               # needed to commit the snapshot back to the repo

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false     # never cancel a half-finished snapshot commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0          # full history so rebase before push works
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build snapshot (live data)
        env:
          DATA_FETCH_TIMEOUT: "30"
        run: |
          python -m tools.build_snapshot auto || (echo "retrying after partial fetch..." && sleep 10 && python -m tools.build_snapshot auto)
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/static/snapshot.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: daily snapshot refresh [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); retrying after rebase..."
            sleep $((attempt * 2))
          done
          echo "failed to push snapshot after 5 attempts"
          exit 1
